version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - bodyclose
    - noctx
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
  exclusions:
    rules:
      - path: '_test\.go$'
        linters: [gosec, noctx, errcheck, bodyclose]
formatters:
  enable:
    - gofmt
    - goimports
