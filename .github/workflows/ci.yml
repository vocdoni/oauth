# SPDX-License-Identifier: AGPL-3.0-only
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  go:
    # The Go kit and the Go example: lint, vet, race tests (fake provider and
    # cross-kit cookie fixtures), vulnerability check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            examples/go/go.sum
      - name: golangci-lint (kit)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
          working-directory: go
      - name: golangci-lint (example)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
          working-directory: examples/go
      - name: vet and test
        run: |
          set -euo pipefail
          (cd go && go vet ./... && go test -race -count=1 ./...)
          (cd examples/go && go vet ./... && go test -count=1 ./...)
      - name: govulncheck
        run: |
          set -euo pipefail
          (cd go && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...)
          (cd examples/go && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...)

  node:
    # The Node kit: locked install, high-severity audit, typecheck, vitest
    # (fake provider, cross-kit cookie fixtures, Express example), build, pack.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: node/.nvmrc
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high --omit=dev
      - run: npm run typecheck
      - run: npm test
      - name: build and pack
        run: |
          npm run build
          npm pack --dry-run

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck scripts/*.sh

  image:
    # Builds the image (amd64), runs the container smoke test, then registers a
    # demo client with `make add-client` and smoke-tests that config too
    # (unknown fields disallowed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: oauth:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=oauth-ci
          cache-to: type=gha,mode=max,scope=oauth-ci
      - name: container smoke test
        run: scripts/smoke.sh oauth:ci
      - name: add-client config loads (acceptance 5)
        run: |
          set -euo pipefail
          make add-client ID=demo URL=https://demo.example/auth/callback
          git diff --stat config.yaml
          scripts/smoke.sh oauth:ci config.yaml
      - name: dev image builds
        run: docker build --target dev -t oauth:dev-config .
