# SPDX-License-Identifier: AGPL-3.0-only
version: 2
updates:
  - package-ecosystem: gomod
    directories: [/go, /examples/go]
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Dex minor/major upgrades need a volume backup first (README,
    # Operations); only patch releases are proposed automatically.
    ignore:
      - dependency-name: "ghcr.io/dexidp/dex"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "build(docker)"
