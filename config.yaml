# SPDX-License-Identifier: AGPL-3.0-only
#
# Dex configuration for https://oauth.vocdoni.org.
#
# This file is a gomplate template rendered by the upstream Dex entrypoint at
# container start. Its only template expressions read the ISSUER variable
# (issuer and Google redirect URI) and PORT (listen port), plus presence
# checks in comments that stop the container when a required secret variable
# is missing. Secret values are never templated: Dex reads them itself ($VAR
# in the connector config, secretEnv for clients).
#
# Add a tool with `make add-client ID=<id> URL=<callback>`; keep
# staticClients the last section of this file.

issuer: {{ .Env.ISSUER }}

storage:
  type: sqlite3
  config:
    file: /data/dex.db

web:
  http: 0.0.0.0:{{ .Env.PORT }}

logger:
  level: info
  format: json
  excludeFields: [email, username, preferred_username]

frontend:
  issuer: Vocdoni
  logoURL: theme/vocdoni-logo.png
  theme: light
  dir: /srv/dex/web

expiry:
  idTokens: 10m
  authRequests: 10m
  deviceRequests: 5m
  # Dex already issued refresh tokens to any client requesting offline_access; now they
  # can be redeemed too, so such a client keeps access up to 7 days. The kits do not
  # request offline_access. Rotated on use; 3s reuse window for retried requests.
  refreshTokens:
    disableRotation: false
    reuseInterval: 3s
    validIfNotUsedFor: 24h
    absoluteLifetime: 168h

# Signing keys rotate every 6 h (expiry.signingKeys is deprecated in v2.46.0).
signer:
  type: local
  config:
    keysRotationPeriod: 6h

oauth2:
  # refresh_token takes effect only for clients that request offline_access.
  grantTypes: [authorization_code, refresh_token]
  responseTypes: [code]
  skipApprovalScreen: true
  alwaysShowLoginScreen: false
  pkce:
    enforce: true
    codeChallengeMethodsSupported: [S256]

enablePasswordDB: false

connectors:
  # {{ if not (getenv "GOOGLE_CLIENT_ID") }}{{ fail "GOOGLE_CLIENT_ID is not set" }}{{ end }}
  # {{ if not (getenv "GOOGLE_CLIENT_SECRET") }}{{ fail "GOOGLE_CLIENT_SECRET is not set" }}{{ end }}
  - type: google
    id: google
    name: Google
    config:
      clientID: $GOOGLE_CLIENT_ID
      clientSecret: $GOOGLE_CLIENT_SECRET
      redirectURI: {{ .Env.ISSUER }}/callback
      hostedDomains:
        - vocdoni.org

staticClients:
  # {{ if not (getenv "CLIENT_FOLIO_SECRET") }}{{ fail "CLIENT_FOLIO_SECRET is not set" }}{{ end }}
  - id: folio
    name: Folio
    secretEnv: CLIENT_FOLIO_SECRET
    redirectURIs:
      - https://folio.vocdoni.net/ui/api/oidc/callback
  # {{ if not (getenv "CLIENT_KB_SECRET") }}{{ fail "CLIENT_KB_SECRET is not set" }}{{ end }}
  - id: "kb"
    name: "Vocdoni KB"
    secretEnv: CLIENT_KB_SECRET
    redirectURIs:
      - https://kb.vocdoni.net/api/auth/oidc/vocdoni/callback
  # {{ if not (getenv "CLIENT_CLAUDE_PROXY_SECRET") }}{{ fail "CLIENT_CLAUDE_PROXY_SECRET is not set" }}{{ end }}
  - id: "claude-proxy"
    name: "Claude proxy"
    secretEnv: CLIENT_CLAUDE_PROXY_SECRET
    redirectURIs:
      - https://claude.vocdoni.net/auth/callback
  # {{ if not (getenv "CLIENT_AUDITORE_SECRET") }}{{ fail "CLIENT_AUDITORE_SECRET is not set" }}{{ end }}
  - id: "auditore"
    name: "Auditore"
    secretEnv: CLIENT_AUDITORE_SECRET
    redirectURIs:
      - https://auditore.vocdoni.net/auth/callback
  # {{ if not (getenv "CLIENT_LEADS_CRM_SECRET") }}{{ fail "CLIENT_LEADS_CRM_SECRET is not set" }}{{ end }}
  - id: "leads-crm"
    name: "Leads CRM"
    secretEnv: CLIENT_LEADS_CRM_SECRET
    redirectURIs:
      - https://leads.vocdoni.net/auth/callback
  # Public client (MCP, PKCE, no secret). Pinned to Claude Code's callback port: without
  # redirectURIs Dex accepts any loopback port and the oob URI (paste-the-code phishing).
  # Another port needs its own URI here, by PR.
  - id: "auditore-mcp"
    name: "Auditore MCP"
    public: true
    redirectURIs:
      - http://localhost:8765/callback
      - http://127.0.0.1:8765/callback
